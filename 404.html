<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Watchlistey</title>
    <script>
      (function() {
        var l = window.location;
        var pathname = l.pathname;
        var search = l.search;
        var hash = l.hash;
        var destination = l.protocol + '//' + l.host + '/?p=' + encodeURIComponent(pathname + search + hash);
        l.replace(destination);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
